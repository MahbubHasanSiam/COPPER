<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>COPPER</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="network.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="page" id="page-root">
    <!-- Top bar (shared) -->
    <header class="topbar">
      <div class="top-left">
        <a class="brand-link" href="dashboard.html" aria-label="COPPER dashboard">
          <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="#2563eb"/><path d="M6 12h12" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><path d="M12 6v12" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span class="brand">COPPER</span>
        </a>

        <form id="alumniSearchForm" class="search-form" role="search" aria-label="Search alumni">
          <input id="alumniSearch" type="search" placeholder="Search by name, company, grad year, industry, skills, location, department, mentorship..." aria-label="Search alumni">
          <button type="submit" class="search-btn" aria-label="Search">🔎</button>
        </form>
      </div>

      <div class="top-right">
        <button id="openRequests" class="btn-ghost">Requests</button>
        <a href="settings.html" class="top-link">Settings</a>
        <a href="feed.html" class="top-link">Feed</a>
        <div class="avatar"><img src="https://i.pravatar.cc/48?img=32" alt="User avatar"></div>
      </div>
    </header>

    <main class="container">
      <!-- Grid of alumni -->
      <section class="grid-wrap">
        <div id="alumniGrid" class="alumni-grid" aria-live="polite">
          <!-- JS will render cards here -->
        </div>

        <!-- Side column: filters + quick stats -->
        <aside class="side-panel">
          <section class="card filters" aria-label="Filters">
            <div class="filters-row">
              <button class="chip" data-filter="company">Company ▾</button>
              <button class="chip" data-filter="grad">Graduation Year ▾</button>
              <button class="chip" data-filter="industry">Industry ▾</button>
              <button class="chip" data-filter="location">Location ▾</button>
              <button class="chip" data-filter="skills">Skills ▾</button>
              <button class="chip" data-filter="level">Job Level ▾</button>
              <button class="chip" data-filter="mentor">Available for Mentorship</button>
            </div>

            <div class="active-filters" id="activeFilters" aria-live="polite"></div>
          </section>

          <section class="card side-info">
            <h4>Search tips</h4>
            <p class="muted">Try "Data Scientist", "Class of 2016", "Boston", or select the mentorship chip to find mentors.</p>
            <hr/>
            <div class="stats">
              <div><strong id="resultsCount">0</strong><div class="muted">profiles</div></div>
              <div><strong>Mentors</strong><div class="muted">120 available</div></div>
            </div>
            <hr/>
            <button class="btn-outline full" id="advancedFilters">Advanced filters</button>
          </section>
        </aside>
      </section>

      <!-- Requests slide-over (hidden by default) -->
      <div id="requestsPanel" class="slide-over" aria-hidden="true">
        <div class="slide-inner">
          <header class="slide-header">
            <h3>Connection Requests</h3>
            <button id="closeRequests" class="icon-btn" aria-label="Close">✕</button>
          </header>

          <div class="requests-tabs" role="tablist" aria-label="Request types">
            <button role="tab" aria-selected="true" data-tab="incoming" class="rtab active">Incoming</button>
            <button role="tab" aria-selected="false" data-tab="outgoing" class="rtab">Outgoing</button>
          </div>

          <div id="incomingList" class="requests-list">
            <!-- incoming items -->
          </div>

          <div id="outgoingList" class="requests-list" hidden>
            <!-- outgoing items -->
          </div>
        </div>
      </div>

      <footer class="page-footer muted small">© <span id="copyYear"></span> AlumNet — Mentorship & Career Connections</footer>
    </main>
  </div>
  <script src="theme.js"></script>
  <script src="network.js"></script>
</body>
</html>
